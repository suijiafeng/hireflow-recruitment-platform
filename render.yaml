# HireFlow Render Blueprint
# 部署：Render 控制台 -> New -> Blueprint -> 选择本仓库，会自动读取此文件建服务。
#
# 覆盖范围：API + Web 静态反代两件套。数据库用外部 Postgres（自建或任意云厂商），
# 不由本 Blueprint 托管——见下方 DATABASE_URL 说明。
# 不含 MinIO（Render 无对象存储产品，
# 需要文件上传功能的话请改用 Cloudflare R2 / AWS S3 等 S3 兼容服务，
# 只需在 hireflow-api 的环境变量里填 S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY/S3_BUCKET，
# 代码零改动——见 apps/api/src/modules/storage）。
#
# 首次部署前手动在 Render 环境变量里补上（标了 sync: false 的项，控制台里填，不进 git）：
#   hireflow-api:  DATABASE_URL（外部 Postgres 连接串，格式见下方注释）
#                  ADMIN_EMAIL / ADMIN_PASSWORD（首个管理员；不填密码会随机生成并只在部署日志里打印一次）
#                  ANTHROPIC_API_KEY（留空则自动降级 mock 引擎，全链路仍可用）
#                  S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET（文件存储；不填则落实例本地盘，重建即丢失）
#
# hireflow-web 反代 /api 到 hireflow-api 依赖 Render 同区域私有网络（同 region 的
# Web Service 之间可用 `http://<service-name>:<port>` 互通）。若你的账号/区域没有私网，
# 把 API_ORIGIN 改成 hireflow-api 的公网域名（如 hireflow-api.onrender.com，走 443/TLS，
# 并把 nginx.conf.template 里的 proxy_pass 协议改成 https）。

services:
  - type: web
    name: hireflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: singapore
    # /api/health 只看进程存活；/api/ready 会查库（库不可用返回 503），外部监控可用它
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # 外部 Postgres 连接串，控制台手动填，例如：
      #   postgresql://user:password@host:5432/dbname?sslmode=require
      # 自建库若未配置 SSL 证书，用 sslmode=disable；托管云数据库通常要求 sslmode=require。
      # 需要保证 Postgres 的防火墙/pg_hba.conf 放行 Render 的出口 IP 段
      # （控制台 hireflow-api 服务 -> Connect -> Outbound 面板可查，或见
      # https://render.com/docs/outbound-ip-addresses）。
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # 首个管理员（库里已有管理员时不再创建）。生产环境不会写演示数据
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COMPANY_NAME
        value: HireFlow 科技有限公司
      # 文件存储：填了 S3_ENDPOINT 自动用 S3；不填则落实例本地盘（Render 实例磁盘不持久，重建后文件丢失，只适合试用）
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: AI_PROVIDER
        value: auto
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      # OpenAI 兼容（DeepSeek / 通义等）：不用 Anthropic 时填这三项
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  - type: web
    name: hireflow-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      # 反代上游，两种填法（协议归一化见 deploy/00-api-upstream.envsh）：
      #   付费档（不休眠）：api 服务的 Internal Address，如 hireflow-api-xxxx:3000
      #     ——以控制台 Connect 面板为准，主机名可能带随机后缀，不能想当然填服务名
      #   免费档：api 服务的公网 URL，如 https://hireflow-api-xxxx.onrender.com
      #     ——免费实例休眠后只有公网流量能唤醒，填私网地址会一直 502
      # 手动创建（非 Blueprint）的服务不会读本文件，必须在控制台 Environment 里配置。
      - key: API_ORIGIN
        sync: false
      # 演示模式：true 时登录页展示演示账号（Render 会把环境变量作为 Docker build arg 传入）。
      # 正式部署保持 false——生产构建既不展示演示账号，也不会预填任何密码
      - key: VITE_DEMO_MODE
        value: "false"
